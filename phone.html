<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prototype</title>
<style>
  html,body{margin:0;height:100%;background:#e6e8ec;overflow:hidden}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  .phone{position:relative;width:418px;height:872px;border-radius:64px;background:#111214;
    box-shadow:0 30px 80px rgba(17,18,20,.22),0 4px 14px rgba(17,18,20,.18);transform-origin:center center;flex:none}
  .screen{position:absolute;inset:14px;border-radius:50px;overflow:hidden;background:#fff}
  .screen iframe{width:390px;height:844px;border:0;display:block}
  .bar{position:absolute;top:0;left:0;right:0;height:50px;display:none;align-items:center;justify-content:space-between;padding:0 34px 0 40px;font:600 16px/1 -apple-system,'SF Pro Text',Inter,sans-serif;color:#111;background:var(--bar,#fff);z-index:1}
  .bar svg{display:block}
  .withbar .screen iframe{margin-top:50px;height:794px}
  .withbar .bar{display:flex}
  .island{position:absolute;top:25px;left:50%;transform:translateX(-50%);width:120px;height:34px;border-radius:20px;background:#0b0b0c;z-index:2;pointer-events:none}
</style>
</head>
<body>
<div class="stage">
  <div class="phone" id="phone">
    <div class="screen"><div class="bar"><span>9:41</span><svg width="68" height="13" viewBox="0 0 68 13"><rect x="0" y="8" width="3" height="5" rx="1" fill="#111"/><rect x="5" y="6" width="3" height="7" rx="1" fill="#111"/><rect x="10" y="3" width="3" height="10" rx="1" fill="#111"/><rect x="15" y="0" width="3" height="13" rx="1" fill="#111"/><path d="M30 3.5a9 9 0 0 1 12 0l-1.4 1.5a7 7 0 0 0-9.2 0zM32.6 6.4a5 5 0 0 1 6.8 0L36 10z" fill="#111"/><rect x="45.5" y="1" width="20" height="11" rx="3" fill="none" stroke="#111" opacity=".5"/><rect x="47.5" y="3" width="16" height="7" rx="1.5" fill="#111"/></svg></div><iframe id="app" title="Prototype" allow="clipboard-write"></iframe></div>
    <div class="island" id="island"></div>
  </div>
</div>
<script>
  const p = new URLSearchParams(location.search);
  const src = p.get("src") || "spacehub-app/";
  if (p.get("bar") === "1") { document.getElementById("phone").classList.add("withbar"); if (p.get("barbg")) document.getElementById("phone").style.setProperty("--bar", "#" + p.get("barbg").replace(/[^0-9a-f]/gi, "")); }
  if (p.get("island") === "0") document.getElementById("island").style.display = "none";
  // only allow prototypes from this site
  document.getElementById("app").src = new URL(src, location.href).origin === location.origin ? src : "spacehub-app/";
  const phone = document.getElementById("phone");
  function fit() {
    const pad = 24;
    const s = Math.min((innerWidth - pad) / 418, (innerHeight - pad) / 872, 1);
    phone.style.transform = "scale(" + s + ")";
  }
  addEventListener("resize", fit); fit();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prototype</title>
<style>
  html,body{margin:0;height:100%;background:#e6e8ec;overflow:hidden}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  .phone{position:relative;width:418px;height:872px;border-radius:64px;background:#111214;
    box-shadow:0 30px 80px rgba(17,18,20,.22),0 4px 14px rgba(17,18,20,.18);transform-origin:center center;flex:none}
  .screen{position:absolute;inset:14px;border-radius:50px;overflow:hidden;background:#fff}
  .screen iframe{width:390px;height:844px;border:0;display:block}
  .island{position:absolute;top:25px;left:50%;transform:translateX(-50%);width:120px;height:34px;border-radius:20px;background:#0b0b0c;z-index:2;pointer-events:none}
</style>
</head>
<body>
<div class="stage">
  <div class="phone" id="phone">
    <div class="screen"><iframe id="app" title="Prototype" allow="clipboard-write"></iframe></div>
    <div class="island" id="island"></div>
  </div>
</div>
<script>
  const p = new URLSearchParams(location.search);
  const src = p.get("src") || "spacehub-app/";
  if (p.get("island") === "0") document.getElementById("island").style.display = "none";
  // only allow prototypes from this site
  document.getElementById("app").src = new URL(src, location.href).origin === location.origin ? src : "spacehub-app/";
  const phone = document.getElementById("phone");
  function fit() {
    const pad = 24;
    const s = Math.min((innerWidth - pad) / 418, (innerHeight - pad) / 872, 1);
    phone.style.transform = "scale(" + s + ")";
  }
  addEventListener("resize", fit); fit();
</script>
</body>
</html>
